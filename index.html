<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Test di Letteratura Italiana</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#1a4a8a;--primary-light:#e8f0fb;--accent:#c0392b;
  --success:#27ae60;--warning:#e67e22;--gray:#6c757d;
  --border:#dee2e6;--radius:12px;--shadow:0 2px 16px rgba(0,0,0,.10);
}
html,body{height:100%;overscroll-behavior:none}
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
input[type=text]{-webkit-user-select:text;-moz-user-select:text;user-select:text;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f4f8;min-height:100vh;color:#222;font-size:16px;-webkit-font-smoothing:antialiased}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 14px 48px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 22px;width:100%;max-width:480px}
.logo{text-align:center;margin-bottom:18px}
.logo h1{font-size:20px;font-weight:700;color:var(--primary);line-height:1.3}
.logo p{font-size:13px;color:var(--gray);margin-top:5px}
label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:5px;margin-top:14px}
input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;font-size:16px;transition:border-color .2s;background:#fff;-webkit-appearance:none;appearance:none}
input[type=text]:focus{outline:none;border-color:var(--primary)}
.email-split{display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.email-split:focus-within{border-color:var(--primary)}
.email-split input{flex:1;border:none;padding:12px 10px;font-size:16px;min-width:0;outline:none;background:#fff;-webkit-appearance:none}
.email-domain{display:flex;align-items:center;padding:0 9px;background:#f4f6f8;font-size:13px;color:#666;white-space:nowrap;border-left:1px solid var(--border);flex-shrink:0;user-select:none}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:8px;font-size:17px;font-weight:700;cursor:pointer;margin-top:18px;-webkit-appearance:none;background:var(--primary);color:#fff}
.btn:active{opacity:.88;transform:scale(.98)}
.err{color:var(--accent);font-size:13px;margin-top:10px;padding:9px 12px;background:#fdf0ef;border-radius:6px;display:none;line-height:1.5}
.quiz-header{background:var(--primary);color:#fff;width:100%;position:sticky;top:0;z-index:10;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.q-num{font-weight:700;font-size:15px}
.progress-bar-wrap{height:3px;background:rgba(255,255,255,.2);flex:1;border-radius:2px;margin:0 12px}
.progress-bar{height:100%;background:#fff;border-radius:2px;transition:width .3s}
.timer-ring{position:relative;width:48px;height:48px;flex-shrink:0}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:4}
.timer-bg{stroke:rgba(255,255,255,.22)}
.timer-arc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.quiz-body{width:100%;max-width:600px;padding:0 0 16px}
.question-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin:14px;padding:20px 16px}
.q-text{font-size:15px;font-weight:600;line-height:1.55;margin-bottom:16px;color:#1a1a2e}
.opt{display:flex;align-items:center;gap:11px;padding:13px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:background .12s,border-color .15s;min-height:52px;-webkit-user-select:none;user-select:none}
.opt:active{background:#e9e9e9}
.opt.selected{background:#e0e0e0;border-color:#999!important}
.opt.selected .opt-letter{background:#666}
.opt.missed{background:#fff8ec;border-color:var(--warning)!important}
.opt.missed .opt-letter{background:var(--warning)}
.opt-letter{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-text{font-size:14px;line-height:1.4;flex:1}
.opt.locked{cursor:default;}
.feedback{font-size:13px;margin-top:11px;padding:10px 12px;border-radius:7px;display:none;line-height:1.6}
.feedback.show{display:block}
.feedback.sel-fb{background:#f0f0f0;color:#444;border-left:3px solid #999}
.feedback.missed-fb{background:#fff8ec;color:#856404;border-left:3px solid var(--warning)}
.nav-btn{display:block;width:calc(100% - 28px);margin:0 14px 8px;padding:16px;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;-webkit-appearance:none}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn:active:not(:disabled){opacity:.88}
.results-wrap{width:100%;max-width:520px;padding-bottom:30px}
.score-circle{width:130px;height:130px;border-radius:50%;border:6px solid var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;background:var(--primary-light)}
.score-circle .big{font-size:38px;font-weight:800;color:var(--primary);line-height:1}
.score-circle .sub{font-size:12px;color:var(--gray)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:14px 0}
.stat-box{background:#fff;border-radius:10px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-box .n{font-size:24px;font-weight:800}
.stat-box .l{font-size:11px;color:var(--gray);margin-top:2px}
.stat-box.c .n{color:var(--success)}
.stat-box.w .n{color:var(--accent)}
.stat-box.s .n{color:var(--warning)}
.res-list{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.res-item{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
.res-item:last-child{border-bottom:none}
.res-badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;margin-right:5px}
.badge-c{background:#e8faf0;color:#155724}
.badge-w{background:#fdf0ef;color:#721c24}
.badge-s{background:#fff8ec;color:#856404}
.res-q{font-weight:600;margin-bottom:3px}
.res-ans{color:var(--gray)}
.res-correct{color:var(--success);font-weight:600}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;margin-top:14px;-webkit-appearance:none}
.dl-btn:active{opacity:.88}
@media(max-width:380px){
  .card{padding:20px 14px}
  .q-text{font-size:14px}
  .opt-text{font-size:13px}
  .email-domain{font-size:11px;padding:0 6px}
}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false" oncopy="return false" oncut="return false">

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="card" style="margin-top:28px">
    <div class="logo">
      <h1>📚 Test di Letteratura Italiana</h1>
      <p>IIS Cattaneo Milano — Sonia Merendino</p>
    </div>
    <label for="nome">Nome *</label>
    <input type="text" id="nome" placeholder="Inserisci il tuo nome" autocomplete="given-name">
    <label for="cognome">Cognome *</label>
    <input type="text" id="cognome" placeholder="Inserisci il tuo cognome" autocomplete="family-name">
    <label for="classe">Classe *</label>
    <input type="text" id="classe" placeholder="Es. 5A, 5B...">
    <label>Email scolastica *</label>
    <div class="email-split">
      <input type="text" id="email-local" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <div class="email-domain">@iiscattaneomilano.edu.it</div>
    </div>
    <div id="login-err" class="err"></div>
    <button class="btn" onclick="doLogin()">Inizia il Test &#8594;</button>
    <p style="font-size:11px;color:#bbb;text-align:center;margin-top:12px">50 domande &middot; 50 secondi ciascuna</p>
  </div>
</div>

<!-- TEST -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="q-num" id="q-num-display">Domanda 1/50</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:2%"></div></div>
    <div class="timer-ring">
      <svg viewBox="0 0 48 48" width="48" height="48">
        <circle class="timer-bg" cx="24" cy="24" r="20"/>
        <circle class="timer-arc" id="timer-arc" cx="24" cy="24" r="20" stroke-dasharray="125.7" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text" id="timer-text">50</div>
    </div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
  <button class="nav-btn" id="nav-btn" onclick="nextQuestion()">Avanti &#8594;</button>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen">
  <div class="results-wrap">
    <div class="card" style="text-align:center;margin-bottom:0">
      <h2 style="font-size:17px;color:var(--primary);margin-bottom:14px">Risultato del Test</h2>
      <div class="score-circle"><div class="big" id="res-score">0</div><div class="sub">su 50</div></div>
      <p id="res-student" style="font-size:15px;font-weight:700;color:#333"></p>
      <p id="res-class" style="font-size:13px;color:var(--gray)"></p>
    </div>
    <div class="stats-grid">
      <div class="stat-box c"><div class="n" id="cnt-c">0</div><div class="l">Corrette</div></div>
      <div class="stat-box w"><div class="n" id="cnt-w">0</div><div class="l">Sbagliate</div></div>
      <div class="stat-box s"><div class="n" id="cnt-s">0</div><div class="l">Saltate</div></div>
    </div>
    <button class="dl-btn" onclick="generatePDF()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Scarica PDF per il docente
    </button>
    <div class="res-list" id="res-list"></div>
  </div>
</div>

<script>
const DOMAIN='@iiscattaneomilano.edu.it';
const STORAGE_KEY='test_litt_v2_';
const TIME_PER_Q=50;

const QUESTIONS_MASTER=[
  {q:"Chi è l'autore de Il fu Mattia Pascal?",opts:["Italo Svevo","Luigi Pirandello","Alberto Moravia","Cesare Pavese"],ans:1,exp:"Luigi Pirandello è l'autore de Il fu Mattia Pascal (1904), uno dei suoi romanzi più celebri."},
  {q:"Quale opera è stata scritta da Italo Svevo?",opts:["La coscienza di Zeno","Uno, nessuno e centomila","Il deserto dei Tartari","La luna e i falò"],ans:0,exp:"La coscienza di Zeno (1923) è il capolavoro di Italo Svevo."},
  {q:"A quale movimento è associato Gabriele D'Annunzio?",opts:["Verismo","Futurismo","Decadentismo","Neorealismo"],ans:2,exp:"D'Annunzio è la figura di spicco del Decadentismo italiano."},
  {q:"A quale corrente appartiene Filippo Tommaso Marinetti?",opts:["Ermetismo","Futurismo","Realismo","Simbolismo"],ans:1,exp:"Marinetti è il fondatore del Futurismo italiano (Manifesto del 1909)."},
  {q:"Quale poeta è considerato il 'poeta della prima guerra mondiale'?",opts:["Giuseppe Ungaretti","Giovanni Pascoli","Giosuè Carducci","Gabriele D'Annunzio"],ans:0,exp:"Giuseppe Ungaretti, che combatté sul Carso, è il massimo poeta della Prima Guerra Mondiale."},
  {q:"Chi è l'autore di Mastro Don Gesualdo?",opts:["Luigi Pirandello","Italo Svevo","Gabriele D'Annunzio","Giovanni Verga"],ans:3,exp:"Mastro Don Gesualdo (1889) è il secondo romanzo del Ciclo dei Vinti di Giovanni Verga."},
  {q:"A quale corrente è associato Émile Zola?",opts:["Verismo","Naturalismo","Futurismo","Neorealismo"],ans:1,exp:"Émile Zola è il principale esponente del Naturalismo francese, corrente che influenzò il Verismo italiano."},
  {q:"Chi è il principale esponente del Verismo italiano?",opts:["Giovanni Verga","Luigi Pirandello","Italo Svevo","Gabriele D'Annunzio"],ans:0,exp:"Giovanni Verga è il massimo rappresentante del Verismo italiano, con I Malavoglia e Mastro Don Gesualdo."},
  {q:"Quale ciclo di opere ha progettato Giovanni Verga?",opts:["I Rougon Macquart","I Romanzi della Rosa","Il Ciclo dei Vinti","Maschere nude"],ans:2,exp:"Verga progettò il Ciclo dei Vinti, di cui completò solo I Malavoglia e Mastro Don Gesualdo."},
  {q:"Il Verismo italiano si ispira principalmente a quale corrente europea?",opts:["Romanticismo","Simbolismo","Naturalismo","Futurismo"],ans:2,exp:"Il Verismo è la versione italiana del Naturalismo francese, dal quale prende metodo e ispirazione."},
  {q:"Chi è il principale esponente del Naturalismo francese?",opts:["Victor Hugo","Émile Zola","Gustave Flaubert","Charles Baudelaire"],ans:1,exp:"Émile Zola è il fondatore del Naturalismo francese con il ciclo dei Rougon-Macquart."},
  {q:"Qual è uno dei principi fondamentali del Verismo?",opts:["Idealizzazione della realtà","Rappresentazione oggettiva della realtà","Centralità del fantastico","Uso del mito"],ans:1,exp:"Il Verismo si fonda sulla rappresentazione oggettiva e impersonale della realtà, senza intervento soggettivo dell'autore."},
  {q:"Quale tecnica narrativa è tipica di Verga?",opts:["Narratore onnisciente esplicito","Discorso diretto teatrale","Regressione del narratore","Flusso di coscienza"],ans:2,exp:"La regressione del narratore è la tecnica verghiana: il narratore si immedesima nei personaggi, rinunciando a commentare."},
  {q:"In quale ambiente sono ambientate molte opere di Verga?",opts:["Alta borghesia urbana","Nobiltà rinascimentale","Mondo rurale e popolare","Ambienti fantastici"],ans:2,exp:"Verga ambienta le sue opere nel mondo contadino e peschereccio della Sicilia, ritraendo i ceti più umili."},
  {q:"Quale opera appartiene al ciclo dei Vinti di Verga?",opts:["I Malavoglia","Il fu Mattia Pascal","Senilità","Il piacere"],ans:0,exp:"I Malavoglia (1881) è il primo romanzo del Ciclo dei Vinti di Giovanni Verga."},
  {q:"Secondo Zola, lo scrittore deve comportarsi come:",opts:["Un poeta visionario","Uno scienziato sperimentale","Un narratore fantastico","Un moralista religioso"],ans:1,exp:"Zola nel saggio Il romanzo sperimentale (1880) teorizza che il narratore debba agire come uno scienziato che studia la società."},
  {q:"Qual è un tema centrale del Naturalismo?",opts:["Il libero arbitrio assoluto","Il determinismo sociale e biologico","L'eroismo epico","Il soprannaturale"],ans:1,exp:"Il Naturalismo pone al centro il determinismo: l'individuo è condizionato dall'eredità biologica e dall'ambiente sociale."},
  {q:"Qual è uno dei temi centrali della poetica di Giovanni Pascoli?",opts:["L'eroismo epico","Il fanciullino e la visione infantile del mondo","La celebrazione della tecnica","Il superuomo"],ans:1,exp:"La poetica del fanciullino è il cuore della visione di Pascoli: il poeta è chi conserva uno sguardo infantile e meravigliato."},
  {q:"Nella poetica di Gabriele D'Annunzio, il poeta è visto come:",opts:["Un uomo comune","Un osservatore distaccato","Un esteta e vate","Un ribelle sociale"],ans:2,exp:"D'Annunzio si autoproclama vate (poeta-profeta) ed esteta, celebrando la vita come opera d'arte."},
  {q:"Quale caratteristica distingue la poesia di Giuseppe Ungaretti?",opts:["Uso di versi lunghi e complessi","Linguaggio ricco e barocco","Essenzialità e brevità espressiva","Narrazione epica"],ans:2,exp:"La poesia di Ungaretti è caratterizzata da brevità estrema e parole essenziali, come in M'illumino d'immenso."},
  {q:"Qual è il ruolo della memoria nella poesia di Umberto Saba?",opts:["È irrilevante","Serve a costruire miti eroici","È uno strumento di introspezione personale","È usata per descrivere la politica"],ans:2,exp:"Per Saba la memoria è strumento di autoanalisi: nel Canzoniere ripercorre la propria vita con sincerità e introspezione."},
  {q:"La poetica del fanciullino di Pascoli si basa sull'idea che:",opts:["Il poeta debba essere un politico","Dentro ogni uomo viva un bambino capace di stupirsi","La poesia sia razionale","Il linguaggio debba essere complesso"],ans:1,exp:"Pascoli afferma che in ogni uomo viva un fanciullino capace di stupirsi e percepire la poesia nelle cose quotidiane."},
  {q:"Il concetto di superuomo dannunziano deriva da:",opts:["Marx","Nietzsche","Freud","Kant"],ans:1,exp:"D'Annunzio rielabora il concetto nietzschiano di Uebermensch, adattandolo alla figura dell'esteta e guerriero."},
  {q:"La poetica di fine Ottocento è segnata da:",opts:["Fiducia nella ragione","Crisi dei valori e ricerca di nuove forme espressive","Stabilità culturale","Ritorno al classicismo puro"],ans:1,exp:"Il fin de siecle è caratterizzato da crisi del Positivismo, relativismo e ricerca di nuovi linguaggi espressivi."},
  {q:"Il tema della guerra nella poesia di Giuseppe Ungaretti è rappresentato come:",opts:["Glorificazione eroica","Esperienza tragica e personale","Evento lontano e astratto","Occasione politica"],ans:1,exp:"Ungaretti vive la guerra dal fronte e la rappresenta come tragedia umana e dolore personale, non come gloria eroica."},
  {q:"Il tema dell'identità in Luigi Pirandello è caratterizzato da:",opts:["Stabilità dell'io","Unità interiore","Molteplicità e crisi dell'io","Esaltazione dell'individualismo"],ans:2,exp:"Per Pirandello l'io è frantumato: ognuno ha più maschere e non esiste un'identità autentica e stabile."},
  {q:"In Italo Svevo, il protagonista è spesso:",opts:["Un eroe vincente","Un inetto incapace di agire","Un politico","Un artista ispirato"],ans:1,exp:"L'inetto è il tipo umano sveviano per eccellenza: individuo paralizzato dall'indecisione, incapace di adattarsi alla società."},
  {q:"Il tema della memoria in Umberto Saba riguarda:",opts:["Eventi storici globali","Ricordi personali e familiari","Miti classici","Fantascienza"],ans:1,exp:"Il Canzoniere di Saba è una memoria poetica della vita privata: l'infanzia, Trieste, gli amori, la famiglia."},
  {q:"In Gabriele D'Annunzio, la natura è spesso:",opts:["Ostile e minacciosa","Indifferente","Fonte di piacere sensoriale (panismo)","Irrilevante"],ans:2,exp:"Il panismo dannunziano è la fusione sensoriale e gioiosa dell'uomo con la natura, celebrata nelle Laudi."},
  {q:"Il tema dell'infanzia in Giovanni Pascoli è legato a:",opts:["Gioco e spensieratezza pura","Visione poetica e conoscitiva","Critica politica","Realismo sociale"],ans:1,exp:"L'infanzia in Pascoli è chiave di accesso a una visione poetica del mondo, libera da razionalità adulta."},
  {q:"La crisi delle certezze nel primo Novecento porta a:",opts:["Maggiore fiducia nella ragione","Semplificazione della realtà","Smarrimento esistenziale e relativismo","Ritorno al classicismo puro"],ans:2,exp:"Il Novecento si apre con una crisi profonda: relativismo einsteiniano, psicoanalisi freudiana e filosofia nietzschiana."},
  {q:"Il tema del vero in Giovanni Verga si basa su:",opts:["Idealizzazione della realtà","Rappresentazione oggettiva e impersonale","Fantasia e immaginazione","Visione religiosa"],ans:1,exp:"Verga persegue la rappresentazione del vero come rappresentazione impersonale e oggettiva, senza giudizi morali."},
  {q:"Nei romanzi di Verga, il destino dei personaggi è spesso:",opts:["Libero e autodeterminato","Segnato da fatalismo e condizioni sociali","Sempre positivo","Eroico"],ans:1,exp:"Il fatalismo è centrale nel Verismo: i personaggi di Verga sono vittime di forze sociali ed economiche che non controllano."},
  {q:"Il Decadentismo esprime principalmente:",opts:["Fiducia nella scienza","Crisi dei valori e irrazionalismo","Esaltazione della politica","Realismo sociale"],ans:1,exp:"Il Decadentismo nasce come reazione al Positivismo, privilegiando l'irrazionale, il mistero e il simbolo."},
  {q:"In Gabriele D'Annunzio, il tema dell'estetismo indica:",opts:["Rifiuto dell'arte","Centralità della bellezza e della vita come opera d'arte","Interesse scientifico","Critica sociale"],ans:1,exp:"L'estetismo dannunziano è la concezione della vita come opera d'arte: il bello come valore supremo, superiore alla morale."},
  {q:"Il tema dello spleen in Charles Baudelaire rappresenta:",opts:["Divertimento quotidiano","Disagio esistenziale","Energia vitale","Entusiasmo patriottico"],ans:1,exp:"Lo spleen baudelairiano è noia, angoscia esistenziale e senso di soffocamento della vita moderna, tema centrale dei Fiori del male."},
  {q:"In Giovanni Pascoli, la natura è spesso:",opts:["Razionale e scientifica","Misteriosa e simbolica","Solo decorativa","Politica"],ans:1,exp:"Per Pascoli la natura è carica di simboli e misteri, specchio dell'interiorità del poeta e del suo dolore."},
  {q:"Il Naturalismo francese, legato a Émile Zola, propone:",opts:["Narrazione fantastica","Analisi scientifica della realtà sociale","Idealismo romantico","Poesia lirica"],ans:1,exp:"Zola teorizza nel Romanzo sperimentale che la letteratura debba applicare il metodo scientifico allo studio della società."},
  {q:"Il tema dell'inetto nella narrativa di fine Ottocento indica:",opts:["Un uomo forte e vincente","Un individuo incapace di adattarsi alla società","Un eroe epico","Una figura mitologica"],ans:1,exp:"L'inetto è già presente in Svevo (Una vita, 1892) e si sviluppa come tipo umano simbolo della crisi borghese novecentesca."},
  {q:"La figura dell'artista decadente è spesso:",opts:["Integrata nella società","Emarginata e incompresa","Politicamente attiva","Tradizionalista"],ans:1,exp:"L'artista decadente si percepisce come incompreso, alieno dalla società borghese, rifugiandosi nell'arte e nella bellezza."},
  {q:"La poetica del Verismo di Giovanni Verga si fonda su:",opts:["Centralità dell'autore","Impersonalità e regressione del narratore","Linguaggio aulico","Idealizzazione dei personaggi"],ans:1,exp:"L'impersonalità è il cardine del Verismo verghiano: l'autore scompare e lascia parlare i fatti e i personaggi."},
  {q:"La tecnica dell'impersonalità in Verga implica:",opts:["Commento morale esplicito","Coinvolgimento emotivo dell'autore","Narrazione oggettiva senza giudizio","Uso della prima persona"],ans:2,exp:"L'impersonalità significa narrare senza intervenire, come se i fatti si raccontassero da soli, adottando il punto di vista dei personaggi."},
  {q:"La poetica di Gabriele D'Annunzio si caratterizza per:",opts:["Semplicità espressiva","Estetismo e culto della bellezza","Realismo sociale","Linguaggio tecnico"],ans:1,exp:"D'Annunzio è il massimo esponente dell'estetismo italiano, con una scrittura ricchissima al servizio del culto del Bello."},
  {q:"Il Decadentismo rifiuta:",opts:["L'irrazionale","Il simbolismo","Il positivismo e la fiducia nella scienza","L'arte"],ans:2,exp:"Il Decadentismo si configura come reazione al Positivismo e al razionalismo, privilegiando il sogno, il simbolo, l'inconscio."},
  {q:"La poetica simbolista, legata a Charles Baudelaire, si basa su:",opts:["Descrizione oggettiva","Uso di simboli e analogie","Narrazione storica","Linguaggio scientifico"],ans:1,exp:"Il Simbolismo usa simboli, analogie e sinestesie per evocare stati d'animo, rifiutando la descrizione letterale."},
  {q:"La figura del poeta-vate in D'Annunzio implica:",opts:["Distacco dalla società","Guida spirituale ed estetica delle masse","Ironia e distacco","Umiltà"],ans:1,exp:"Il vate è il poeta-profeta che si eleva sugli altri, guida spirituale ed estetica della nazione, come D'Annunzio si autorappresentò."},
  {q:"Quale raccolta poetica di Ungaretti è legata all'esperienza della Prima Guerra Mondiale?",opts:["Il porto sepolto","Il canzoniere","Ossi di seppia","Alcyone"],ans:0,exp:"Il porto sepolto (1916), poi confluito in L'allegria di naufragi, raccoglie le poesie scritte al fronte sul Carso."},
  {q:"Quale opera di Pirandello esplora il tema delle maschere sociali attraverso il teatro?",opts:["Sei personaggi in cerca d'autore","I Malavoglia","La coscienza di Zeno","Il piacere"],ans:0,exp:"Sei personaggi in cerca d'autore (1921) è il capolavoro teatrale di Pirandello in cui finzione e realtà si mescolano."},
  {q:"Cosa si intende con il termine decadentismo in letteratura?",opts:["Ritorno ai valori classici","Movimento che esalta la ragione","Corrente che privilegia irrazionale, simbolo e bellezza malata","Realismo descrittivo della società"],ans:2,exp:"Il Decadentismo privilegia l'irrazionale, il mistero, il simbolo e l'arte per l'arte, in reazione al Positivismo di fine Ottocento."},
  {q:"Quale romanzo di D'Annunzio è considerato il manifesto dell'estetismo italiano?",opts:["Il fuoco","Notturno","Il piacere","Forse che si forse che no"],ans:2,exp:"Il piacere (1889) è il primo romanzo di D'Annunzio e il manifesto dell'estetismo italiano: Andrea Sperelli vive la vita come opera d'arte."}
];

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildRandomized(){
  return shuffle(QUESTIONS_MASTER).map(q=>{
    const order=shuffle([0,1,2,3]);
    return {q:q.q,opts:order.map(i=>q.opts[i]),ans:order.indexOf(q.ans),exp:q.exp};
  });
}

let QUESTIONS=[],student={},answers=[],currentQ=0,timerInterval=null,timeLeft=TIME_PER_Q,answered=false,_startTime=null;

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');window.scrollTo(0,0);}

function doLogin(){
  const nome=document.getElementById('nome').value.trim();
  const cognome=document.getElementById('cognome').value.trim();
  const classe=document.getElementById('classe').value.trim();
  const local=document.getElementById('email-local').value.trim().toLowerCase();
  const email=local+DOMAIN;
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!nome||!cognome||!classe||!local){err.textContent='Compila tutti i campi obbligatori.';err.style.display='block';return;}
  if(local.includes('@')||local.includes(' ')){err.textContent="Inserisci solo la parte iniziale dell'email (prima della @).";err.style.display='block';return;}
  if(localStorage.getItem(STORAGE_KEY+email)){err.textContent='Hai gia completato il test con questa email. Il test puo essere effettuato una sola volta.';err.style.display='block';return;}
  student={nome,cognome,classe,email};
  QUESTIONS=buildRandomized();
  answers=new Array(QUESTIONS.length).fill(null);
  currentQ=0;_startTime=new Date();showScreen('quiz');renderQuestion();
}

function renderQuestion(){
  const q=QUESTIONS[currentQ];const L=['A','B','C','D'];
  document.getElementById('q-num-display').textContent='Domanda '+(currentQ+1)+'/'+QUESTIONS.length;
  document.getElementById('progress-bar').style.width=((currentQ+1)/QUESTIONS.length*100)+'%';
  let html='<div class="question-card"><div class="q-text">'+(currentQ+1)+'. '+q.q+'</div>';
  q.opts.forEach((opt,i)=>{html+='<div class="opt" id="opt-'+i+'" onclick="selectAnswer('+i+')"><div class="opt-letter">'+L[i]+'</div><div class="opt-text">'+opt+'</div></div>';});
  html+='<div class="feedback" id="feedback"></div></div>';
  document.getElementById('quiz-body').innerHTML=html;
  const nb=document.getElementById('nav-btn');
  nb.textContent=currentQ<QUESTIONS.length-1?'Avanti \u2192':'Termina il Test';
  nb.disabled=true;answered=false;startTimer();
}

function startTimer(){
  clearInterval(timerInterval);timeLeft=TIME_PER_Q;updateTimerUI();
  timerInterval=setInterval(()=>{timeLeft--;updateTimerUI();if(timeLeft<=0){clearInterval(timerInterval);autoSkip();}},1000);
}
function updateTimerUI(){
  const arc=document.getElementById('timer-arc'),txt=document.getElementById('timer-text');
  arc.style.strokeDashoffset=(2*Math.PI*20)*(1-timeLeft/TIME_PER_Q);
  txt.textContent=timeLeft;
  arc.style.stroke=timeLeft<=10?'#ff6b6b':timeLeft<=20?'#ffd166':'#fff';
}
function selectAnswer(idx){
  if(answered)return; // timer scaduto, locked
  // Rimuovi selezione precedente
  for(let i=0;i<4;i++){
    const el=document.getElementById('opt-'+i);
    if(el){el.classList.remove('selected');}
  }
  // Segna la nuova selezione in grigio
  const chosen=document.getElementById('opt-'+idx);
  if(chosen)chosen.classList.add('selected');
  // Salva risposta (sovrascrive quella precedente)
  answers[currentQ]=idx;
  // Mostra feedback neutro
  const fb=document.getElementById('feedback');
  fb.className='feedback sel-fb show';
  fb.innerHTML='Risposta selezionata. Puoi cambiarla finché il tempo non scade.';
  // Abilita il tasto Avanti
  document.getElementById('nav-btn').disabled=false;
}
function lockQuestion(){
  // Chiamata allo scadere del timer o al click su Avanti: blocca tutto
  answered=true;
  clearInterval(timerInterval);
  for(let i=0;i<4;i++){
    const el=document.getElementById('opt-'+i);
    if(el){el.onclick=null;el.style.pointerEvents='none';el.classList.add('locked');}
  }
  const fb=document.getElementById('feedback');
  if(answers[currentQ]!==null){
    fb.className='feedback sel-fb show';
    fb.innerHTML='Risposta registrata.';
  }
}
function autoSkip(){
  if(answered)return;
  lockQuestion();
  answers[currentQ]=null; // nessuna risposta
  const fb=document.getElementById('feedback');
  fb.className='feedback missed-fb show';
  fb.innerHTML='<strong>Tempo scaduto.</strong> Nessuna risposta registrata.';
  document.getElementById('nav-btn').disabled=false;
}
function nextQuestion(){
  lockQuestion();
  if(currentQ<QUESTIONS.length-1){currentQ++;renderQuestion();window.scrollTo(0,0);}else{showResults();}
}
function showResults(){
  clearInterval(timerInterval);localStorage.setItem(STORAGE_KEY+student.email,'done');
  let correct=0,wrong=0,skipped=0;
  answers.forEach((a,i)=>{if(a===null)skipped++;else if(a===QUESTIONS[i].ans)correct++;else wrong++;});
  showScreen('results');
  document.getElementById('res-score').textContent=correct;
  document.getElementById('res-student').textContent=student.nome+' '+student.cognome;
  document.getElementById('res-class').textContent='Classe: '+student.classe;
  document.getElementById('cnt-c').textContent=correct;
  document.getElementById('cnt-w').textContent=wrong;
  document.getElementById('cnt-s').textContent=skipped;
  const L=['A','B','C','D'];let html='';
  QUESTIONS.forEach((q,i)=>{
    const a=answers[i];let badge,cls,ansText;
    if(a===null){badge='Saltata';cls='badge-s';ansText='--';}
    else if(a===q.ans){badge='Corretta';cls='badge-c';ansText=L[a]+') '+q.opts[a];}
    else{badge='Sbagliata';cls='badge-w';ansText=L[a]+') '+q.opts[a];}
    html+='<div class="res-item"><div class="res-q"><span class="res-badge '+cls+'">'+badge+'</span>'+(i+1)+'. '+q.q+'</div><div class="res-ans">Risposta: '+ansText+'</div>'+(a!==q.ans?'<div class="res-correct">Corretta: '+L[q.ans]+') '+q.opts[q.ans]+'</div>':'')+'</div>';
  });
  document.getElementById('res-list').innerHTML=html;
}

// ─────────────────────────────────────────────────────
//  PDF — STILE PULITO, LEGGIBILITA' BES
// ─────────────────────────────────────────────────────
function generatePDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,ML=18,MR=18,contentW=W-ML-MR;

  // Palette BES: alto contrasto, niente texture, colori netti
  const WHITE  =[255,255,255];
  const BG     =[250,251,253];
  const NAVY   =[25,55,110];
  const DARK   =[25,25,30];
  const MID    =[95,95,105];
  const LGRAY  =[215,218,226];
  const GREEN_B=[0,115,65];
  const GREEN_L=[228,248,236];
  const RED_B  =[165,20,20];
  const RED_L  =[252,232,232];
  const ORG_B  =[165,95,0];
  const ORG_L  =[255,244,220];

  // Interlinea generosa per BES
  const LH=6.0, LHs=5.2, LHe=4.8;

  // Calcolo tempo di completamento
  const elapsed=Math.round((new Date()-_startTime)/1000);
  const mm=Math.floor(elapsed/60).toString().padStart(2,'0');
  const ss=(elapsed%60).toString().padStart(2,'0');
  const tempoStr=mm+' min '+ss+' sec';

  // Voto in decimi (0 corrette = 1; 50 corrette = 10)
  let correct=0,wrong=0,skipped=0;
  answers.forEach((a,i)=>{if(a===null)skipped++;else if(a===QUESTIONS[i].ans)correct++;else wrong++;});
  const voto=Math.round((1+correct/50*9)*10)/10;
  const votoStr=voto.toFixed(1).replace('.',',')+' / 10';

  const L=['A','B','C','D'];
  let pageNum=0;
  const BOTTOM=H-18;

  function drawBase(){
    doc.setFillColor(...BG);doc.rect(0,0,W,H,'F');
    doc.setFillColor(...NAVY);doc.rect(0,0,W,2.5,'F');
    doc.setFillColor(...LGRAY);doc.rect(0,H-2.5,W,2.5,'F');
  }
  function drawFooter(){
    doc.setDrawColor(...LGRAY);doc.setLineWidth(0.3);doc.line(ML,H-11,W-MR,H-11);
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...MID);
    doc.text('IIS Cattaneo Milano  —  Sonia Merendino  —  Test di Letteratura Italiana',ML,H-6.5);
    doc.text('Pag. '+pageNum,W-MR,H-6.5,{align:'right'});
  }
  function newPage(first){
    if(!first)doc.addPage();
    pageNum++;drawBase();drawFooter();
  }

  // ── PAGINA 1 ──
  newPage(true);
  let y=8;

  // Fascia titolo navy
  doc.setFillColor(...NAVY);doc.rect(ML,y,contentW,22,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...WHITE);
  doc.text('Test di Letteratura Italiana',ML+5,y+9);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('IIS Cattaneo Milano  —  Docente: Sonia Merendino  —  Risultati per il Docente',ML+5,y+17);
  y+=26;

  // Scheda studente
  doc.setFillColor(...WHITE);doc.setDrawColor(...NAVY);doc.setLineWidth(0.6);
  doc.rect(ML,y,contentW,36,'FD');
  doc.setFillColor(...NAVY);doc.rect(ML,y,5,36,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...NAVY);
  doc.text(student.nome+' '+student.cognome,ML+9,y+9);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...DARK);
  doc.text('Classe:   '+student.classe,ML+9,y+17);
  doc.text('Email:    '+student.email,ML+9,y+24);
  const dataStr=new Date().toLocaleDateString('it-IT',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  doc.text('Data:     '+dataStr+'   —   Ore: '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),ML+9,y+31);
  doc.text('Durata:   '+tempoStr,ML+9,y+35.5);
  y+=40;

  // ── Riquadro punteggio / voto / tempo ──
  const rH=34;
  const col1W=contentW*0.33, col2W=contentW*0.34, col3W=contentW-col1W-col2W;
  // colonna 1: punteggio
  doc.setFillColor(...NAVY);doc.rect(ML,y,col1W,rH,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(26);doc.setTextColor(...WHITE);
  doc.text(correct+' / 50',ML+col1W/2,y+16,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);
  doc.text('punteggio',ML+col1W/2,y+23,{align:'center'});
  // colonna 2: voto
  doc.setFillColor(...WHITE);doc.setDrawColor(...NAVY);doc.setLineWidth(0.5);
  doc.rect(ML+col1W,y,col2W,rH,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(...NAVY);
  doc.text(votoStr,ML+col1W+col2W/2,y+16,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MID);
  doc.text('voto in decimi',ML+col1W+col2W/2,y+23,{align:'center'});
  // colonna 3: tempo
  doc.setFillColor(...WHITE);doc.setDrawColor(...LGRAY);doc.setLineWidth(0.4);
  doc.rect(ML+col1W+col2W,y,col3W,rH,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...DARK);
  doc.text(tempoStr,ML+col1W+col2W+col3W/2,y+16,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MID);
  doc.text('tempo completamento',ML+col1W+col2W+col3W/2,y+23,{align:'center'});
  y+=rH+5;

  // ── Tabella statistiche ──
  const stW=(contentW-6)/3;
  [[correct,'Risposte corrette',GREEN_B,GREEN_L],
   [wrong,'Risposte sbagliate',RED_B,RED_L],
   [skipped,'Domande saltate',ORG_B,ORG_L]].forEach(([n,lbl,bc,bl],k)=>{
    const bx=ML+k*(stW+3);
    doc.setFillColor(...bl);doc.setDrawColor(...bc);doc.setLineWidth(0.5);
    doc.rect(bx,y,stW,15,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...bc);
    doc.text(n.toString(),bx+stW/2,y+9,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);
    doc.text(lbl,bx+stW/2,y+13.5,{align:'center'});
  });
  y+=21;

  // Titolo sezione
  doc.setDrawColor(...LGRAY);doc.setLineWidth(0.35);doc.line(ML,y,W-MR,y);
  y+=4;
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...NAVY);
  doc.text('DETTAGLIO RISPOSTE',ML,y);
  y+=7;

  // ── DOMANDE ──
  QUESTIONS.forEach((q,i)=>{
    const a=answers[i];
    let status,bgC,bordC;
    if(a===null){status='SALTATA';bgC=ORG_L;bordC=ORG_B;}
    else if(a===q.ans){status='CORRETTA';bgC=GREEN_L;bordC=GREEN_B;}
    else{status='SBAGLIATA';bgC=RED_L;bordC=RED_B;}

    // pre-calcola righe con font corretto
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);
    const qLines=doc.splitTextToSize((i+1)+'.  '+q.q,contentW-20);
    doc.setFont('helvetica','normal');doc.setFontSize(9);
    let ansLines=[];
    if(a!==null) ansLines=doc.splitTextToSize('Risposta data:     '+L[a]+')  '+q.opts[a],contentW-20);
    doc.setFont('helvetica','bold');doc.setFontSize(9);
    let corrLines=[];
    if(a!==q.ans) corrLines=doc.splitTextToSize('Risposta corretta: '+L[q.ans]+')  '+q.opts[q.ans],contentW-20);
    doc.setFont('helvetica','italic');doc.setFontSize(8.5);
    let expLines=[];
    if(a!==q.ans) expLines=doc.splitTextToSize('Spiegazione: '+q.exp,contentW-20);

    const PAD=5;
    let blockH=PAD+qLines.length*LH;
    if(ansLines.length>0) blockH+=LHs*0.6+ansLines.length*LHs;
    if(corrLines.length>0) blockH+=LHs*0.6+corrLines.length*LHs;
    if(expLines.length>0) blockH+=LHe*0.6+expLines.length*LHe;
    blockH+=PAD;

    if(y+blockH>BOTTOM){
      newPage(false);
      doc.setFillColor(...NAVY);doc.rect(ML,8,contentW,10,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...WHITE);
      doc.text(student.nome+' '+student.cognome+'  —  Classe '+student.classe+'  —  Letteratura Italiana',ML+4,14.5);
      y=22;
    }

    // Blocco bianco con bordo colorato
    doc.setFillColor(...WHITE);doc.setDrawColor(...bordC);doc.setLineWidth(0.5);
    doc.rect(ML,y,contentW,blockH,'FD');
    // Barra laterale colorata (7mm)
    doc.setFillColor(...bgC);doc.rect(ML,y,7,blockH,'F');
    doc.setDrawColor(...bordC);doc.setLineWidth(0.4);
    doc.line(ML+7,y,ML+7,y+blockH);
    // Numero nel tab
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...bordC);
    doc.text((i+1).toString(),ML+3.5,y+PAD+2.5,{align:'center'});

    // Badge status (pill arrotondato)
    const bW=24,bH=5.5;
    doc.setFillColor(...bordC);
    doc.roundedRect(W-MR-bW-1,y+2,bW,bH,2,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...WHITE);
    doc.text(status,W-MR-bW/2-1,y+6,{align:'center'});

    let ly=y+PAD+LH*0.85;

    // Domanda
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...DARK);
    doc.text(qLines,ML+10,ly);
    ly+=qLines.length*LH;

    // Risposta data
    if(ansLines.length>0){
      ly+=LHs*0.6;
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MID);
      doc.text(ansLines,ML+10,ly);
      ly+=ansLines.length*LHs;
    }
    // Risposta corretta
    if(corrLines.length>0){
      ly+=LHs*0.6;
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...GREEN_B);
      doc.text(corrLines,ML+10,ly);
      ly+=corrLines.length*LHs;
    }
    // Spiegazione
    if(expLines.length>0){
      ly+=LHe*0.6;
      doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(...MID);
      doc.text(expLines,ML+10,ly);
    }

    y+=blockH+3;
  });

  doc.save('Test_Letteratura_'+student.cognome+'_'+student.nome+'_'+student.classe+'.pdf');
}
